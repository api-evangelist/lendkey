openapi: 3.2.0
info:
  title: Treasury Management API (via Kong Gateway) Payments API
  version: v1
  description: '# Treasury Management API - Kong Gateway Documentation


    ## Overview


    The Treasury Management API provides endpoints for managing loan inventory, disbursements, payments, and treasury operations.'
  contact:
    name: LendKey Platform Team
    url: https://lendkey.com
servers:
- url: https://api.lendkey.com/TreasuryMgmt
  description: Production Environment
security:
- oauth2: []
tags:
- name: Payments
  description: Payment and remittance processing
paths:
  /v1/createPayment:
    post:
      summary: Create Payment
      description: 'Inserts payment/remittance data for loan obligations.


        Use this endpoint to record payments made against loans, including:

        - Interest payments

        - Principal payments

        - Late fees

        - Other charges


        **Kong Route:** `/v1/createPayment`

        **Backend:** `/TreasuryManagement_API/rest/v1/createPayment`'
      tags:
      - Payments
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              principalPayment:
                summary: Principal payment
                value:
                  subledgerCategory: Payment
                  isSubledgerReversal: false
                  subledgerItemCode: PRINCIPAL
                  paymentId: PMT-2025-001
                  payorEntityType: Borrower
                  amount: 1000.0
                  loanExternalId: LOAN-12345
                  purpose: Monthly principal payment
              interestPayment:
                summary: Interest payment
                value:
                  subledgerCategory: Payment
                  isSubledgerReversal: false
                  subledgerItemCode: INTEREST
                  paymentId: PMT-2025-002
                  payorEntityType: Borrower
                  amount: 150.0
                  loanExternalId: LOAN-12345
                  purpose: Monthly interest payment
              lateFeePayment:
                summary: Late fee payment
                value:
                  subledgerCategory: Payment
                  isSubledgerReversal: false
                  subledgerItemCode: Late Fee
                  paymentId: PMT-2025-003
                  payorEntityType: Borrower
                  amount: 25.0
                  loanExternalId: LOAN-12345
                  purpose: Late payment fee
      responses:
        '200':
          description: Payment successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
        '207':
          description: Multi-status (partial success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
        '400':
          description: Bad request (validation errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (invalid or expired token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreatePaymentRequest:
      type: object
      required:
      - subledgerCategory
      - isSubledgerReversal
      - subledgerItemCode
      - paymentId
      - payorEntityType
      - amount
      - loanExternalId
      properties:
        subledgerCategory:
          type: string
          enum:
          - Payment
          description: Subledger category (must be "Payment")
          example: Payment
        isSubledgerReversal:
          type: boolean
          description: Whether this is a reversal transaction
          example: false
        subledgerItemCode:
          type: string
          enum:
          - INTEREST
          - PRINCIPAL
          - Late Fee
          - NSF Fee
          - Other
          description: Type of payment
          example: PRINCIPAL
        paymentId:
          type: string
          description: Unique payment identifier
          example: PMT-2025-001
        payorEntityType:
          type: string
          description: Type of entity making payment (e.g., Borrower)
          example: Borrower
        amount:
          type: number
          format: double
          description: Payment amount
          example: 1000.0
        loanExternalId:
          type: string
          description: External loan identifier
          example: LOAN-12345
        purpose:
          type: string
          description: Optional payment purpose/description
          example: Monthly principal payment
    ErrorResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          description: Success indicator (always false for errors)
          example: false
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Error message
          example: Invalid request
        errors:
          type: array
          description: Detailed error messages
          items:
            type: string
          example:
          - Field 'loanUUID' is required
          - Field 'amount' must be greater than 0
    CreatePaymentResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          description: Overall success indicator
          example: true
        statusCode:
          type: integer
          description: HTTP status code (200, 207, 400, 500)
          example: 200
        responseDetails:
          type: array
          items:
            type: object
            properties:
              paymentId:
                type: string
                description: Payment identifier
                example: PMT-2025-001
              errors:
                type: array
                description: Array of error messages (if any)
                items:
                  type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 client credentials flow via Kong Gateway
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
