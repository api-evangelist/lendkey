openapi: 3.0.3
info:
  title: LendKey E-Sign API (via Kong Gateway) Application Contracts Payments API
  version: 0.1
  description: "# LendKey E-Sign API - Kong Gateway Documentation\n\n## Overview\n\nThe LendKey E-Sign API provides endpoints for creating and managing electronic signature contracts using DocuSign.\nThis API is accessed through Kong Gateway, which handles authentication via OAuth2.\n\n## Authentication\n\nAll requests to this API require OAuth2 authentication through Kong Gateway.\n\n### Step 1: Get OAuth2 Token\n\nBefore calling any endpoint, you must obtain an access token:\n\n**Production Environment:**\n```bash\ncurl -X POST https://api.lendkey.com/esign/oauth2/token \\\n  -d \"grant_type=client_credentials\" \\\n  -d \"client_id=YOUR_CLIENT_ID\" \\\n  -d \"client_secret=YOUR_CLIENT_SECRET\"\n```\n\n**Response:**\n```json\n{\n  \"access_token\": \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\",\n  \"token_type\": \"bearer\",\n  \"expires_in\": 7200\n}\n```\n\n### Step 2: Use Token in API Calls\n\nInclude the access token in the `Authorization` header:\n```\nAuthorization: Bearer YOUR_ACCESS_TOKEN\n```\n\n**Token Lifetime:** 2 hours (7200 seconds)\n\n## Base URLs (Kong Gateway)\n\n| Environment | Kong Base URL | Backend Kubernetes Service |\n|------------|---------------|---------------------------|\n| **Production** | `https://api.lendkey.com/esign` | `main-esign-kotlin.ci.lkeyprod.com` |\n\n## How Kong Routes Requests\n\nWhen you call Kong:\n```\nhttps://api.lendkey.com/esign/applications\n```\n\nKong:\n1. Validates your OAuth2 token\n2. Strips the `/esign` prefix\n3. Forwards to: `http://main-esign-kotlin.ci.lkeyprod.com/applications`\n\nYou don't need to manage any backend authentication - Kong handles everything!\n\n## Getting Started\n\n1. **Get Credentials:** Contact your Kong admin or use the Kong Developer Portal\n2. **Get Token:** Use the OAuth2 token endpoint for your environment\n3. **Call API:** Use the token in the Authorization header\n4. **Refresh:** Get a new token every 2 hours\n"
  contact:
    name: LendKey Platform Team
    url: https://lendkey.com
servers:
- url: https://api.lendkey.com/esign
  description: Production Environment
security:
- oauth2: []
tags:
- name: Payments
  description: Payment and remittance processing
paths:
  /v1/createPayment:
    post:
      summary: Create Payment
      description: 'Inserts payment/remittance data for loan obligations.


        Use this endpoint to record payments made against loans, including:

        - Interest payments

        - Principal payments

        - Late fees

        - Other charges


        **Kong Route:** `/v1/createPayment`

        **Backend:** `/TreasuryManagement_API/rest/v1/createPayment`

        '
      tags:
      - Payments
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              principalPayment:
                summary: Principal payment
                value:
                  subledgerCategory: Payment
                  isSubledgerReversal: false
                  subledgerItemCode: PRINCIPAL
                  paymentId: PMT-2025-001
                  payorEntityType: Borrower
                  amount: 1000.0
                  loanExternalId: LOAN-12345
                  purpose: Monthly principal payment
              interestPayment:
                summary: Interest payment
                value:
                  subledgerCategory: Payment
                  isSubledgerReversal: false
                  subledgerItemCode: INTEREST
                  paymentId: PMT-2025-002
                  payorEntityType: Borrower
                  amount: 150.0
                  loanExternalId: LOAN-12345
                  purpose: Monthly interest payment
              lateFeePayment:
                summary: Late fee payment
                value:
                  subledgerCategory: Payment
                  isSubledgerReversal: false
                  subledgerItemCode: Late Fee
                  paymentId: PMT-2025-003
                  payorEntityType: Borrower
                  amount: 25.0
                  loanExternalId: LOAN-12345
                  purpose: Late payment fee
      responses:
        '200':
          description: Payment successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
        '207':
          description: Multi-status (partial success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
        '400':
          description: Bad request (validation errors)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (invalid or expired token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreatePaymentResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          description: Overall success indicator
          example: true
        statusCode:
          type: integer
          description: HTTP status code (200, 207, 400, 500)
          example: 200
        responseDetails:
          type: array
          items:
            type: object
            properties:
              paymentId:
                type: string
                description: Payment identifier
                example: PMT-2025-001
              errors:
                type: array
                description: Array of error messages (if any)
                items:
                  type: string
    ErrorResponse:
      type: object
      properties:
        isSuccess:
          type: boolean
          description: Success indicator (always false for errors)
          example: false
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: Error message
          example: Invalid request
        errors:
          type: array
          description: Detailed error messages
          items:
            type: string
          example:
          - Field 'loanUUID' is required
          - Field 'amount' must be greater than 0
    CreatePaymentRequest:
      type: object
      required:
      - subledgerCategory
      - isSubledgerReversal
      - subledgerItemCode
      - paymentId
      - payorEntityType
      - amount
      - loanExternalId
      properties:
        subledgerCategory:
          type: string
          enum:
          - Payment
          description: Subledger category (must be "Payment")
          example: Payment
        isSubledgerReversal:
          type: boolean
          description: Whether this is a reversal transaction
          example: false
        subledgerItemCode:
          type: string
          enum:
          - INTEREST
          - PRINCIPAL
          - Late Fee
          - NSF Fee
          - Other
          description: Type of payment
          example: PRINCIPAL
        paymentId:
          type: string
          description: Unique payment identifier
          example: PMT-2025-001
        payorEntityType:
          type: string
          description: Type of entity making payment (e.g., Borrower)
          example: Borrower
        amount:
          type: number
          format: double
          description: Payment amount
          example: 1000.0
        loanExternalId:
          type: string
          description: External loan identifier
          example: LOAN-12345
        purpose:
          type: string
          description: Optional payment purpose/description
          example: Monthly principal payment
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 client credentials flow via Kong Gateway
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
