aid: lendkey
name: LendKey
description: >-
  LendKey Technologies is a New York based digital lending platform that lets credit
  unions and community banks originate, fund and service consumer loans without
  building the technology themselves. Its network-lending model covers private
  student loans, student loan refinancing, home improvement lending and auto lending,
  and its ALIRO platform runs loan participations and post-origination liquidity
  between institutions. LendKey has surpassed $8 billion in loan originations. For
  integrators it operates a Kong Gateway fronted API estate published through a Kong
  Developer Portal at developer.lendkey.com, covering origination intake (leads, soft
  credit pull, credit attributes, scoring and application boarding), treasury
  management (loan inventory, disbursements, payments and capital ledger), and
  DocuSign backed e-signature contracts. Access is partner gated, with OAuth2
  client-credentials credentials issued through the developer portal.
